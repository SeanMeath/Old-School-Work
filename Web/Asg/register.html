<html>
    <head>
        <script src="//ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js" type="text/javascript"></script>
        <link rel="stylesheet" href="style.css">
        <script src="register.js"></script>
        <title>Register</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    </head>
    <body>
        <h1>Register</h1>
        <p>hint: Stars are bad :(</p>
        <form action="register.php" method="post">
        <table>
            <tr>
                <td>First Name:</td>
                <td><input type="text" name="fname" id="fname" maxlength="20"><p style="color:Tomato; display : none;" id="starA">*</p><br></td>
            </tr>
            <tr>
                <td>Last Name:</td>
                <td><input type="text" name="lname" id="lname" maxlength="50"><p style="color:Tomato; display : none;" id="starB">*</p><br></td>
            </tr>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="user" id="user" maxlength="20"><p style="color:Tomato; display : none;" id="star1">*</p><br></td>
                <td><div name="alert" id="alert"></div></td>
            </tr>
            <tr>
                    <td>Email:</td>
                    <td><input type="email" name="email" id="email" maxlength="50"><p style="color:Tomato; display : none;" id="star2">*</p><br></td>
            </tr>
            <tr>
                    <td>Password:</td>
                    <td><input type="password" name="pass" id="pass" maxlength="10"><p style="color:Tomato; display : none;" id="star3">*</p><br></td>
                    <td><div name="alert2" id="alert2"></div></td>
            </tr>
            <tr>
                    <td>Confirm Password:</td>
                    <td><input type="password" name="confirmPass" id="confirmPass" maxlength="10"><p style="color:Tomato; display : none;" id="star4">*</p><br></td>
            </tr>
            <tr>
                    <td>Security Question:</td>
                    <td><input type="text" name="secQuestion" id="secQuestion" maxlength="100"><p style="color:Tomato; display : none;" id="star5">*</p><br></td>
            </tr>
            <tr>
                    <td>Security Answer:</td>
                    <td><input type="text" name="secAnswer" id="secAnswer" maxlength="20"><p style="color:Tomato; display : none;" id="star6">*</p><br></td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Create Account" id="submit" disabled>
                    </form>
                </td>
                <td>
                    <form action="login.html" method="post">
                        <input type="submit" value="I already have an account" id="submit">
                    </form>
                </td>
            </tr>        
        </table>
    </body>
</html>
